name: Metallic Monsters Checker

on:
  schedule:
    # 15分おきに自動実行（実際のチェック頻度はcheck.pyで制御）
    - cron: '*/15 * * * *'
  workflow_dispatch:      # 手動実行ボタン

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 履歴ファイル(prices.json)をコミット＆プッシュするための書き込み権限

    steps:
      # 最新のメジャーバージョン(@v5, @v5)に変更
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python check.py

      # 変更された価格履歴(data/prices.json)をリポジトリへ自動コミット＆プッシュ
      - name: Commit and push updated price history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update price history [skip ci]" && git push)
