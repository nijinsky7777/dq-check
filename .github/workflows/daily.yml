name: Daily Checker

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日日本時間の朝9時に動く設定
  workflow_dispatch:      # 手動でいつでも試せる設定

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'
      - name: Run Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py
