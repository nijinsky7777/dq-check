name: Daily Link Checker

on:
  schedule:
    # 毎日 日本時間 朝7:30 に自動実行 (UTCの22:30に設定)
    - cron: '30 22 * * *'
  workflow_dispatch:      # 手動実行ボタンはそのまま残す

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # BeautifulSoupも使わなくなったので標準機能だけで動きます
      - name: Run Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py
